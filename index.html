<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climate Compare</title>
<script>/* Appearance: Light or Dark, saved on this device. Light by default. */
(function(){var t="light";try{t=localStorage.getItem("mwn-climate-theme")==="dark"?"dark":"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<meta name="description" content="Compare the typical year-round climate of two U.S. cities side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column (max 980px). Hero + selector card, then a sticky
   tab bar over result sections. Two city colors carry through every view:
   City A = lake blue, City B = sunset orange. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --surface-2: #F7F9FA;
  --ink: #14202B;
  --muted: #5A6875;
  --line: #E0E6EB;
  --city-a: #2160A8;
  --city-a-soft: rgba(33, 96, 168, .10);
  --city-b: #D45A1F;
  --city-b-soft: rgba(212, 90, 31, .10);
  --focus: #2160A8;
  --warm: #B4471A;
  --cool: #2160A8;
  --shadow: 0 1px 2px rgba(20, 32, 43, .05), 0 6px 24px rgba(20, 32, 43, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #172029; --surface-2: #1C2731; --ink: #E7EDF2; --muted: #95A3B0; --line: #2A3641;
    --city-a: #6EA8EE; --city-a-soft: rgba(110, 168, 238, .14); --city-b: #F2894F; --city-b-soft: rgba(242, 137, 79, .14);
    --focus: #6EA8EE; --warm: #F2894F; --cool: #6EA8EE; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #172029; --surface-2: #1C2731; --ink: #E7EDF2; --muted: #95A3B0; --line: #2A3641;
  --city-a: #6EA8EE; --city-a-soft: rgba(110, 168, 238, .14); --city-b: #F2894F; --city-b-soft: rgba(242, 137, 79, .14);
  --focus: #6EA8EE; --warm: #F2894F; --cool: #6EA8EE; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- Hero ---------- */
.hero { padding-block: 40px 22px; display: grid; gap: 10px; }
.brand { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(90deg, var(--city-a) 50%, var(--city-b) 50%); }
.hero h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.04; font-weight: 700; }
.hero p { margin: 0; color: var(--muted); font-size: clamp(16px, 2.2vw, 19px); max-width: 52ch; }

/* ---------- Picker card ---------- */
.picker {
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 18px; display: grid; gap: 14px;
}
.picker-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.vs { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 15px; padding-bottom: 15px; text-align: center; }
.picker-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.btn-primary {
  border: 0; border-radius: 999px; padding: 14px 26px; min-height: 50px;
  background: var(--ink); color: var(--surface); font-weight: 700; font-size: 16px; cursor: pointer;
}
.btn-primary:hover { opacity: .9; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- City selector (combobox) ---------- */
.city-select { position: relative; display: grid; gap: 6px; min-width: 0; }
.city-select label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.swatch.a { background: var(--city-a); } .swatch.b { background: var(--city-b); }
.city-input {
  width: 100%; min-height: 54px; padding: 12px 40px 12px 14px;
  border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface-2);
  font-size: 17px; font-weight: 600;
}
.city-select[data-city="a"] .city-input:focus { border-color: var(--city-a); outline: none; box-shadow: 0 0 0 4px var(--city-a-soft); }
.city-select[data-city="b"] .city-input:focus { border-color: var(--city-b); outline: none; box-shadow: 0 0 0 4px var(--city-b-soft); }
.city-select .chev { position: absolute; right: 14px; bottom: 19px; pointer-events: none; color: var(--muted); }
.listbox {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0;
  max-height: 300px; overflow-y: auto; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow);
}
.listbox li { padding: 11px 12px; border-radius: var(--r-sm); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; min-height: 44px; align-items: center; }
.listbox li .reg { color: var(--muted); font-size: 13px; white-space: nowrap; }
.listbox li[aria-selected="true"], .listbox li:hover { background: var(--surface-2); }
.listbox li.empty { color: var(--muted); cursor: default; }

/* ---------- Results header ---------- */
.results { margin-top: 34px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; scroll-margin-top: 12px; }
.results > *, .panel > *, .two-col > *, .summary-grid > * { min-width: 0; }
.matchup { display: grid; gap: 14px; }
.matchup-names { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.matchup-names h2 { font-size: clamp(26px, 5vw, 40px); line-height: 1.08; }
.matchup-names .a { color: var(--city-a); } .matchup-names .b { color: var(--city-b); }
.matchup-names .vs-inline { font-family: var(--font-display); color: var(--muted); font-weight: 500; font-size: 18px; }
.matchup-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.period { color: var(--muted); font-size: 14px; margin: 0; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 14px; min-height: 40px; min-width: 48px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 46px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn-ghost:hover { background: var(--surface-2); }

/* ---------- Tabs ---------- */
.tabs-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 8px; margin-inline: -16px; padding-inline: 16px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; min-height: 44px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- Panels & cards ---------- */
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card h3 { font-size: 20px; margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

/* Insights */
.insights { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.insight { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.insight:first-child { border-top: 0; padding-top: 2px; }
.insight .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; justify-self: start; }
.insight .tag.a { background: var(--city-a-soft); color: var(--city-a); }
.insight .tag.b { background: var(--city-b-soft); color: var(--city-b); }
.insight .tag.same { background: var(--surface-2); color: var(--muted); }
.insight p { margin: 0; font-size: 16px; max-width: 64ch; }
.insight.similar p { color: var(--muted); }

/* Summary cards */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.summary h3 { display: flex; align-items: center; gap: 8px; }
.summary.a h3 { color: var(--city-a); } .summary.b h3 { color: var(--city-b); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 10px 0 0; }
.stat { padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.stat:nth-child(odd) { padding-right: 12px; }
.stat dt { font-size: 13px; color: var(--muted); }
.stat dd { margin: 2px 0 0; font-size: 24px; font-weight: 700; font-family: var(--font-display); line-height: 1.15; }
.stat dd small { font-size: 14px; font-weight: 500; color: var(--muted); font-family: var(--font-body); }

/* Charts */
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 16px; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }
.readout { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 14px; align-items: baseline; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 14px; margin-bottom: 6px; font-size: 14px; }
.readout .m { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.readout .v { font-weight: 700; font-size: 18px; }
.readout .v.a { color: var(--city-a); } .readout .v.b { color: var(--city-b); }
.readout .v small { color: var(--muted); font-weight: 500; font-size: 13px; }
.chart { width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* Tables */
.table-scroll { overflow-x: auto; margin-top: 4px; }
table.mt { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.mt th, .mt td { padding: 9px 8px; text-align: center; white-space: nowrap; }
.mt thead th { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.mt thead tr.cities th { font-size: 14px; letter-spacing: 0; text-transform: none; border-bottom: 0; padding-bottom: 2px; }
.mt thead tr.cities th.a { color: var(--city-a); } .mt thead tr.cities th.b { color: var(--city-b); }
.mt tbody th { text-align: left; font-weight: 600; color: var(--ink); }
.mt tbody td { font-size: 16px; font-weight: 600; }
.mt tbody tr + tr > * { border-top: 1px solid var(--line); }
.mt td.t { border-radius: 8px; }
.mt tbody tr.now th { color: var(--focus); }
.mt tfoot td, .mt tfoot th { font-weight: 700; border-top: 2px solid var(--line); padding-top: 12px; }
.mt tfoot th { text-align: left; }
.mt .gap { width: 10px; padding: 0; }

/* Empty state */
.empty-state { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty-state strong { display: block; font-family: var(--font-display); color: var(--ink); font-size: 20px; margin-bottom: 4px; }

/* Extremes */
.extreme { display: grid; gap: 14px; }
.ex-row { display: grid; gap: 6px; }
.ex-row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-row .name { font-weight: 600; }
.ex-row .val { font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.ex-row .val small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 14px; }
.track { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; }
.fill.a { background: var(--city-a); } .fill.b { background: var(--city-b); }
.month-strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.month-strip span { text-align: center; font-size: 11px; font-weight: 600; padding: 7px 0; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.month-strip.a span.on { background: var(--city-a); color: var(--surface); }
.month-strip.b span.on { background: var(--city-b); color: var(--surface); }
.strip-label { font-size: 14px; font-weight: 600; margin: 8px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.strip-label span:last-child { color: var(--muted); font-weight: 500; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }


/* Unavailable data */
.na { color: var(--muted); font-weight: 600; font-family: var(--font-body); }

/* About the data */
.about { display: grid; gap: 10px; }
.about p, .about li { max-width: 68ch; margin: 0; color: var(--ink); }
.about h4 { margin: 8px 0 0; font-family: var(--font-display); font-size: 16px; }
.about ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.about-periods { display: flex; flex-wrap: wrap; gap: 10px; margin: 2px 0 4px; }
.about-periods div { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 14px; }
.about-periods dt { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.about-periods dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; }

/* Recent vs. Normal */
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; min-height: 44px; font-weight: 700; cursor: pointer; color: var(--muted); }
.pill.a[aria-pressed="true"] { border-color: var(--city-a); color: var(--city-a); background: var(--city-a-soft); }
.pill.b[aria-pressed="true"] { border-color: var(--city-b); color: var(--city-b); background: var(--city-b-soft); }
.change-lede { margin: 0 0 6px; font-size: 17px; max-width: 62ch; }
.mt.change td { font-size: 16px; }
.mt.change td.muted { color: var(--muted); font-weight: 500; }
.mt.change .yr { font-weight: 500; letter-spacing: 0; text-transform: none; }
.delta { font-weight: 700; }
.delta.up { color: var(--warm); }
.delta.down { color: var(--cool); }


/* Footer */
.attrib { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 6px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.attrib a { color: inherit; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
.share-fallback { display: grid; gap: 6px; }
.share-fallback input { width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }

/* ---------- Settings + tour ---------- */
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gear { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.gear:hover { background: var(--surface-2); }
.tourlink { justify-self: start; border: 0; background: none; padding: 4px 0; color: var(--city-a); font-weight: 700; font-size: 15px; cursor: pointer; }
.site-foot { color: var(--muted); font-size: 13px; text-align: center; margin: 28px 0 0; }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(10, 16, 22, .55); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); width: 100%; max-width: 460px; max-height: 100%; overflow: auto; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet h2 { font-size: 23px; margin-bottom: 6px; }
.sheet p { color: var(--muted); margin: 6px 0; }
.sheet ul { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 10px; }
.sheet li { display: flex; gap: 10px; align-items: flex-start; }
.sheet li > span:first-child { flex: none; width: 24px; text-align: center; }
.sheet li b { color: var(--ink); }
.sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-top .step { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.textbtn { border: 0; background: none; color: var(--city-a); font-weight: 700; cursor: pointer; padding: 6px 0; font-size: 15px; }
.tour-ico { width: 60px; height: 60px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 30px; margin-bottom: 12px; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 14px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); }
.dots i.on { width: 22px; background: linear-gradient(90deg, var(--city-a), var(--city-b)); }
.sheet-foot { display: flex; gap: 10px; }
.sheet-foot .btn-primary { flex: 1; }
.btn-soft { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 12px 20px; min-height: 50px; font-weight: 700; cursor: pointer; }
.set-row { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row h3 { font-size: 16px; }
.set-row .seg { justify-self: start; }

/* ---------- Mobile ---------- */
@media (max-width: 680px) {
  .hero { padding-block: 26px 16px; }
  .picker { padding: 16px; }
  .picker-row { grid-template-columns: 1fr; gap: 6px; }
  .vs { padding: 2px 0; font-size: 13px; }
  .picker-foot { flex-direction: column-reverse; align-items: stretch; }
  .btn-primary { width: 100%; }
  .summary-grid, .two-col { grid-template-columns: 1fr; }
  .insight { grid-template-columns: 1fr; gap: 8px; }
  .card { padding: 16px; border-radius: 18px; }
  .mt th, .mt td { padding: 8px 4px; }
  .mt tbody td { font-size: 15px; }
  .readout { grid-template-columns: auto 1fr; }
  .readout .m { grid-row: span 2; align-self: center; }
  .month-strip span { font-size: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width .35s ease; }
}
</style>
</head>
<body>
<div class="wrap">

<script>/* ==========================================================================
   Climate Compare · LOGIC LAYER (pure functions, no DOM)
   Everything here is calculated from the data layer. No city-specific text.
   ========================================================================== */
(function (root) {
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const sum = (arr) => arr.reduce((s, v) => s + v, 0);
  const avg = (arr) => sum(arr) / arr.length;
  const pick = (arr, idxs) => idxs.map((i) => arr[i]);
  const SUMMER = [5, 6, 7];   // Jun, Jul, Aug
  const WINTER = [11, 0, 1];  // Dec, Jan, Feb

  /* ---------- Units ---------- */
  const toUnit = (f, unit) => (unit === "C" ? (f - 32) * 5 / 9 : f);
  const diffToUnit = (dF, unit) => (unit === "C" ? dF * 5 / 9 : dF);
  const fmtTemp = (f, unit) => `${Math.round(toUnit(f, unit))}°`;
  const fmtTempU = (f, unit) => `${Math.round(toUnit(f, unit))}°${unit}`;
  const fmtDiff = (dF, unit) => `${Math.round(Math.abs(diffToUnit(dF, unit)))}°`;
  const fmtIn = (v, digits = 1) => `${v.toFixed(digits)} in`;
  const fmtDays = (v) => `${Math.round(v)}`;
  const thresholdLabel = (f, unit) => (unit === "C" ? `${Math.round(toUnit(f, "C"))}°C` : `${f}°F`);

  const cityLabel = (c) => `${c.name}, ${c.state}`;
  /* A city "view" carries snowStatus:
       ok          monthly snowfall values exist for the selected source
       rare        NOAA publishes no snowfall normal for the station (snow is rare there)
       unavailable recent snowfall records are too incomplete to average            */
  const hasSnowData = (c) => c.snowStatus === "ok" && Array.isArray(c.snow);
  const annualSnow = (c) => (hasSnowData(c) ? sum(c.snow) : 0);
  /** "Meaningful" snow = at least 1 inch a year on average. */
  const getsSnow = (c) => hasSnowData(c) && annualSnow(c) >= 1;
  /** Little or no snow, either measured, or (when recent records are missing) per the 1991–2020 normal. */
  const littleSnow = (c) => (hasSnowData(c) && annualSnow(c) < 1) || c.snowStatus === "rare" ||
    (c.snowStatus === "unavailable" && c.normalSnowLittle === true);
  const snowKnown = (c) => getsSnow(c) || littleSnow(c);
  const hasCore = (c) => Array.isArray(c.high) && Array.isArray(c.low) && Array.isArray(c.precip);

  /* ---------- Data sources ----------
     Builds the object every component reads, from either the Recent Climate
     layer or the official 1991–2020 normals. Missing data stays null.        */
  function buildView(city, recentData, source) {
    const base = { id: city.id, name: city.name, state: city.state, region: city.region,
      station: city.station, stationName: city.stationName, source };
    const normalSnowLittle = !Array.isArray(city.snow) || sum(city.snow) < 1;
    if (source === "normal") {
      return { ...base, high: city.high, low: city.low, precip: city.precip,
        snow: city.snow, snowStation: city.snowStation || null,
        snowStatus: Array.isArray(city.snow) ? "ok" : "rare", normalSnowLittle,
        days90: city.days90, days32: city.days32, days90Monthly: null, days32Monthly: null };
    }
    const r = (recentData && recentData.cities[city.id]) || {};
    return { ...base, high: r.high || null, low: r.low || null, precip: r.precip || null,
      snow: r.snow || null, snowStation: r.snowStation || null,
      snowStatus: Array.isArray(r.snow) ? "ok" : "unavailable", normalSnowLittle,
      days90: r.days90 ?? null, days32: r.days32 ?? null,
      days90Monthly: r.days90Monthly || null, days32Monthly: r.days32Monthly || null };
  }

  /* ---------- Recent vs official normal (measured differences only) ---------- */
  function changeVsNormal(recentView, normalView) {
    const diff = (a, b) => (Array.isArray(a) && Array.isArray(b) ? a.map((v, i) => v - b[i]) : null);
    const total = (arr) => (Array.isArray(arr) ? sum(arr) : null);
    return {
      high: diff(recentView.high, normalView.high),
      low: diff(recentView.low, normalView.low),
      meanHigh: hasCore(recentView) ? avg(recentView.high) - avg(normalView.high) : null,
      meanLow: hasCore(recentView) ? avg(recentView.low) - avg(normalView.low) : null,
      precip: [total(recentView.precip), total(normalView.precip)],
      snow: [hasSnowData(recentView) ? total(recentView.snow) : null, hasSnowData(normalView) ? total(normalView.snow) : null],
      days90: [recentView.days90, normalView.days90],
      days32: [recentView.days32, normalView.days32]
    };
  }

  /* ---------- Annual summary ---------- */
  function summarize(c) {
    const means = c.high.map((h, i) => (h + c.low[i]) / 2);
    const hottestMonth = c.high.indexOf(Math.max(...c.high));
    const coldestMonth = c.low.indexOf(Math.min(...c.low));
    const wettestMonth = c.precip.indexOf(Math.max(...c.precip));
    return {
      hottestMonth,
      coldestMonth,
      wettestMonth,
      maxHigh: Math.max(...c.high),
      minLow: Math.min(...c.low),
      summerHigh: avg(pick(c.high, SUMMER)),
      winterLow: avg(pick(c.low, WINTER)),
      winterHigh: avg(pick(c.high, WINTER)),
      meanLow: avg(c.low),
      meanTemp: avg(means),
      swing: Math.max(...means) - Math.min(...means),
      precip: sum(c.precip),
      snow: hasSnowData(c) ? sum(c.snow) : null,
      days90: c.days90,
      days32: c.days32,
      hotMonths: c.high.map((h, i) => (h >= 90 ? i : -1)).filter((i) => i >= 0),
      freezeMonths: c.low.map((l, i) => (l <= 32 ? i : -1)).filter((i) => i >= 0)
    };
  }

  /* ---------- Insights ----------
     Each insight: { key, label, text, score, similar }
     score is a rough "how big is this difference" number used to sort,
     so the biggest differences appear first.                            */
  function insights(a, b, unit) {
    const A = summarize(a), B = summarize(b);
    const na = a.name, nb = b.name;
    const out = [];

    function tempInsight(key, label, va, vb, threshold, wordMore, makeText, similarText) {
      const d = va - vb;
      if (Math.abs(d) < threshold) {
        out.push({ key, label, text: similarText, score: 0, similar: true });
        return;
      }
      const [w, l, vw, vl] = d > 0 ? [na, nb, va, vb] : [nb, na, vb, va];
      out.push({ key, label, text: makeText(w, l, vw, vl, Math.abs(d)), score: Math.abs(d) / 8, similar: false, winner: d > 0 ? "a" : "b" });
    }

    tempInsight("summer", "Summer", A.summerHigh, B.summerHigh, 1.5, "hotter",
      (w, l, vw, vl, d) => `${w} has hotter summers. Afternoon highs in June through August average ${fmtTemp(vw, unit)}, about ${fmtDiff(d, unit)} warmer than ${l} (${fmtTemp(vl, unit)}).`,
      `Summer afternoons feel about the same. June through August highs average ${fmtTemp(A.summerHigh, unit)} in ${na} and ${fmtTemp(B.summerHigh, unit)} in ${nb}.`);

    {
      const d = A.winterLow - B.winterLow; // negative => A is colder
      if (Math.abs(d) < 1.5) {
        out.push({ key: "winter", label: "Winter", text: `Winter nights are about equally cold. December through February lows average ${fmtTemp(A.winterLow, unit)} in ${na} and ${fmtTemp(B.winterLow, unit)} in ${nb}.`, score: 0, similar: true });
      } else {
        const [c, w, vc, vw] = d < 0 ? [na, nb, A.winterLow, B.winterLow] : [nb, na, B.winterLow, A.winterLow];
        out.push({ key: "winter", label: "Winter", text: `${c} has colder winters. Overnight lows in December through February average ${fmtTemp(vc, unit)}, about ${fmtDiff(d, unit)} colder than ${w} (${fmtTemp(vw, unit)}).`, score: Math.abs(d) / 8, similar: false, winner: d < 0 ? "a" : "b" });
      }
    }

    tempInsight("nights", "Nights", A.meanLow, B.meanLow, 1.5, "warmer",
      (w, l, vw, vl, d) => `${w} has warmer nights year-round. Its average low across the year is ${fmtTemp(vw, unit)}, versus ${fmtTemp(vl, unit)} in ${l}.`,
      `Nights are similar year-round. The average low across the year is ${fmtTemp(A.meanLow, unit)} in ${na} and ${fmtTemp(B.meanLow, unit)} in ${nb}.`);

    // Precipitation
    {
      const d = A.precip - B.precip;
      const rel = Math.abs(d) / Math.max(A.precip, B.precip);
      if (rel < 0.1) {
        out.push({ key: "precip", label: "Rain", text: `Both cities get a similar amount of rain and melted snow each year: ${A.precip.toFixed(1)} inches in ${na} and ${B.precip.toFixed(1)} in ${nb}.`, score: 0, similar: true });
      } else {
        const [w, l, vw, vl] = d > 0 ? [na, nb, A.precip, B.precip] : [nb, na, B.precip, A.precip];
        const ratio = vw / Math.max(vl, 0.01);
        const times = ratio >= 10 ? Math.round(ratio) : ratio.toFixed(1).replace(/\.0$/, "");
        const howMuch = ratio >= 1.8
          ? `about ${times} times as much rain and melted snow as ${l}`
          : `about ${Math.round(vw - vl)} more inches of rain and melted snow than ${l}`;
        out.push({ key: "precip", label: "Rain", text: `${w} is wetter. In a typical year it gets ${howMuch} (${fmtIn(vw)} vs ${fmtIn(vl)}).`, score: rel * 2.5, similar: false, winner: d > 0 ? "a" : "b" });
      }
    }

    // Snow
    {
      const sa = getsSnow(a), sb = getsSnow(b);
      const fallback = [a, b].filter((c) => c.snowStatus === "unavailable" && littleSnow(c)).map((c) => c.name);
      const note = fallback.length ? ` Recent snow records are incomplete for ${fallback.join(" and ")}, so the official 1991–2020 normal is used there.` : "";
      if (!snowKnown(a) || !snowKnown(b)) {
        const which = [a, b].filter((c) => !snowKnown(c)).map((c) => c.name).join(" and ");
        out.push({ key: "snow", label: "Snow", text: `Snowfall isn't compared because recent snow data is unavailable for ${which}.`, score: 0, similar: true });
      } else if (!sa && !sb) {
        out.push({ key: "snow", label: "Snow", text: `Neither city gets meaningful snow. Both see little to no snowfall in a typical year.${note}`, score: 0, similar: true });
      } else if (sa !== sb) {
        const [w, l, v] = sa ? [na, nb, A.snow] : [nb, na, B.snow];
        out.push({ key: "snow", label: "Snow", text: `${w} gets real snow, about ${Math.round(v)} inches a year. ${l} gets little to none.${note}`, score: Math.min(v / 10, 4) + 1, similar: false, winner: sa ? "a" : "b" });
      } else {
        const d = A.snow - B.snow;
        if (Math.abs(d) < 3 || Math.abs(d) / Math.max(A.snow, B.snow) < 0.15) {
          out.push({ key: "snow", label: "Snow", text: `Snowfall is similar: about ${Math.round(A.snow)} inches a year in ${na} and ${Math.round(B.snow)} in ${nb}.`, score: 0, similar: true });
        } else {
          const [w, l, vw, vl] = d > 0 ? [na, nb, A.snow, B.snow] : [nb, na, B.snow, A.snow];
          out.push({ key: "snow", label: "Snow", text: `${w} gets more snow, about ${Math.round(vw)} inches a year compared with ${Math.round(vl)} in ${l}.`, score: Math.abs(d) / 15, similar: false, winner: d > 0 ? "a" : "b" });
        }
      }
    }

    // Seasonal swing
    tempInsight("swing", "Seasons", A.swing, B.swing, 3, "bigger",
      (w, l, vw, vl) => `${w} has bigger seasonal swings. Its warmest month averages ${fmtDiff(vw, unit)} warmer than its coldest month. In ${l} that gap is ${fmtDiff(vl, unit)}.`,
      `Both cities change about the same amount from winter to summer: ${fmtDiff(A.swing, unit)} in ${na} and ${fmtDiff(B.swing, unit)} in ${nb}.`);

    // Hot days (skipped when either city lacks the data)
    if (A.days90 != null && B.days90 != null) {
      const d = A.days90 - B.days90;
      const t = thresholdLabel(90, unit);
      if (Math.abs(d) < 7) {
        out.push({ key: "hot", label: "Hot days", text: `They see a similar number of days at or above ${t}: about ${fmtDays(A.days90)} in ${na} and ${fmtDays(B.days90)} in ${nb}.`, score: 0, similar: true });
      } else {
        const [w, l, vw, vl] = d > 0 ? [na, nb, A.days90, B.days90] : [nb, na, B.days90, A.days90];
        out.push({ key: "hot", label: "Hot days", text: `${w} has more hot days, about ${fmtDays(vw)} days a year at or above ${t}, compared with ${fmtDays(vl)} in ${l}.`, score: Math.abs(d) / 30, similar: false, winner: d > 0 ? "a" : "b" });
      }
    }

    // Freezing nights (skipped when either city lacks the data)
    if (A.days32 != null && B.days32 != null) {
      const d = A.days32 - B.days32;
      const t = thresholdLabel(32, unit);
      if (A.days32 < 1 && B.days32 < 1) {
        out.push({ key: "freeze", label: "Freezing nights", text: `Neither city typically drops to ${t} at night.`, score: 0, similar: true });
      } else if (Math.abs(d) < 7) {
        out.push({ key: "freeze", label: "Freezing nights", text: `Freezing nights are about as common in both: about ${fmtDays(A.days32)} a year in ${na} and ${fmtDays(B.days32)} in ${nb}.`, score: 0, similar: true });
      } else {
        const [w, l, vw, vl] = d > 0 ? [na, nb, A.days32, B.days32] : [nb, na, B.days32, A.days32];
        out.push({ key: "freeze", label: "Freezing nights", text: `${w} has more freezing nights, about ${fmtDays(vw)} nights a year at or below ${t}, compared with ${fmtDays(vl)} in ${l}.`, score: Math.abs(d) / 30, similar: false, winner: d > 0 ? "a" : "b" });
      }
    }

    // Biggest differences first, similarities last
    return out.sort((x, y) => (x.similar === y.similar ? y.score - x.score : x.similar ? 1 : -1));
  }

  root.ClimateLogic = {
    MONTHS, MONTHS_LONG, sum, avg, toUnit, diffToUnit, fmtTemp, fmtTempU, fmtDiff, fmtIn, fmtDays,
    thresholdLabel, cityLabel, hasSnowData, annualSnow, getsSnow, littleSnow, snowKnown, hasCore,
    buildView, changeVsNormal, summarize, insights
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* ==========================================================================
   Climate Compare · UI LAYER
   Reusable components (plain functions) that read from CLIMATE_DATA through
   ClimateLogic. Swapping or extending the dataset needs no UI changes.
   ========================================================================== */
(function () {
  const DATA = window.CLIMATE_DATA;          // official 1991–2020 normals
  const RECENT = window.RECENT_CLIMATE;      // rolling recent 10-year averages
  const L = window.ClimateLogic;
  const RP = RECENT.meta.period;              // e.g. { start: 2016, end: 2025 }
  const RECENT_LABEL = `${RP.start}–${RP.end}`;
  const NORMAL_LABEL = DATA.meta.period;
  const { MONTHS, MONTHS_LONG } = L;
  const CITIES = [...DATA.cities].sort((x, y) => L.cityLabel(x).localeCompare(L.cityLabel(y)));
  const byId = Object.fromEntries(CITIES.map((c) => [c.id, c]));

  const DEFAULT_PAIR = ["austin-tx", "denver-co"];
  const TABS = [
    { id: "glance", label: "At a Glance" },
    { id: "temperature", label: "Temperature" },
    { id: "rain", label: "Rain" },
    { id: "snow", label: "Snow" },
    { id: "extremes", label: "Extreme Heat & Cold" },
    { id: "change", label: "Recent vs. Normal" }
  ];

  const store = {
    get(k) { try { return localStorage.getItem("mwn-climate-" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("mwn-climate-" + k, v); } catch (e) { /* storage unavailable */ } }
  };

  const state = {
    pendingA: null, pendingB: null, // what the selectors show
    a: null, b: null,               // what is being compared
    unit: store.get("unit") === "C" ? "C" : "F",
    source: "recent",                 // "recent" (primary) or "normal" (1991–2020 benchmark)
    changeCity: "a", changeMetric: "high", aboutOpen: false,
    tab: TABS.some((t) => t.id === store.get("tab")) ? store.get("tab") : "glance",
    month: new Date().getMonth()
  };

  /** The object every component reads: one city, in the selected data source. */
  const view = (id, source = state.source) => L.buildView(byId[id], RECENT, source);
  const UNAVAILABLE = "Recent data unavailable";
  const unavailableHTML = (size = 18) => `<span class="na" style="font-size:${size}px">${UNAVAILABLE}</span>`;
  const sourceName = (src = state.source) => (src === "recent" ? `Recent Climate (${RECENT_LABEL})` : `Official Climate Normal (${NORMAL_LABEL})`);

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const $ = (sel, root = document) => root.querySelector(sel);

  /* ======================================================================
     Component: CitySelector (searchable combobox)
     ====================================================================== */
  function CitySelector(host, { key, label, value, onChange }) {
    const listId = `list-${key}`;
    host.innerHTML = `
      <label for="input-${key}"><span class="swatch ${key}" aria-hidden="true"></span>${esc(label)}</label>
      <input class="city-input" id="input-${key}" type="text" role="combobox" aria-autocomplete="list"
        aria-expanded="false" aria-controls="${listId}" spellcheck="false" placeholder="Search a city">
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <ul class="listbox" id="${listId}" role="listbox" hidden></ul>`;
    const input = $("input", host), list = $("ul", host);
    let current = value, matches = [], active = -1;

    const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ");
    function filter(q) {
      const nq = norm(q).trim();
      if (!nq) return CITIES;
      const starts = [], contains = [];
      for (const c of CITIES) {
        const hay = norm(`${c.name} ${c.state} ${c.region}`);
        if (norm(c.name).startsWith(nq)) starts.push(c);
        else if (hay.includes(nq)) contains.push(c);
      }
      return [...starts, ...contains];
    }
    function renderList() {
      if (!matches.length) {
        list.innerHTML = `<li class="empty" role="option" aria-disabled="true">No match. Try the nearest major city.</li>`;
        return;
      }
      list.innerHTML = matches.map((c, i) =>
        `<li role="option" id="${key}-opt-${c.id}" data-id="${c.id}" aria-selected="${i === active}"><span>${esc(L.cityLabel(c))}</span><span class="reg">${esc(c.region)}</span></li>`).join("");
      const el = list.children[active];
      if (el) { el.scrollIntoView({ block: "nearest" }); input.setAttribute("aria-activedescendant", el.id); }
      else input.removeAttribute("aria-activedescendant");
    }
    function open(q = "") {
      matches = filter(q);
      active = matches.findIndex((c) => c.id === current);
      if (q) active = matches.length ? 0 : -1;
      list.hidden = false; input.setAttribute("aria-expanded", "true");
      renderList();
    }
    function close() { list.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); }
    function commit(id) {
      if (!byId[id]) return;
      current = id; input.value = L.cityLabel(byId[id]); close(); onChange(id);
    }
    function revert() { input.value = current ? L.cityLabel(byId[current]) : ""; }

    input.addEventListener("focus", () => { input.select(); open(""); });
    input.addEventListener("click", () => { if (list.hidden) { input.select(); open(""); } });
    input.addEventListener("input", () => open(input.value));
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) open(""); active = Math.min(matches.length - 1, active + 1); renderList(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); renderList(); }
      else if (e.key === "Enter") { if (!list.hidden && matches[active]) { e.preventDefault(); commit(matches[active].id); } }
      else if (e.key === "Escape") { close(); revert(); }
      else if (e.key === "Tab") { if (!list.hidden && input.value && matches[0] && norm(input.value) !== norm(L.cityLabel(byId[current] || {name:"",state:""}))) commit(matches[Math.max(active, 0)].id); else { close(); revert(); } }
    });
    list.addEventListener("pointerdown", (e) => {
      const li = e.target.closest("li[data-id]");
      if (li) { e.preventDefault(); commit(li.dataset.id); }
    });
    input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input) { close(); revert(); } }, 120));

    revert();
    return { set(id) { current = id; revert(); } };
  }

        <p>Recent Climate is the main view because it shows what these cities have actually been like lately. It is based on the most recent 10 complete years of available historical weather observations. The current year is never included until it is complete.</p>
        <h4>How Recent Climate is calculated</h4>
        <ul>
          <li>Source: NOAA’s monthly summaries of each weather station’s daily observations.</li>

          <li>Days at 90°F+ and nights at 32°F or below are the sum of the 12 monthly averages.</li>

  /* ======================================================================
     Component: ClimateInsights
     ====================================================================== */
  function ClimateInsights(a, b, unit) {
    const items = L.insights(a, b, unit);
    return `
      <div class="card">
        <h3>The biggest differences</h3>
        <p class="sub">Calculated from each city’s ${sourceName()} averages, biggest gaps first.</p>
        <ul class="insights">
          ${items.map((it) => {
            const cls = it.similar ? "same" : it.winner;
            return `<li class="insight ${it.similar ? "similar" : ""}"><span class="tag ${cls}">${esc(it.label)}</span><p>${esc(it.text)}</p></li>`;
